<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>日语假名随机练习（带手写板）</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            /* 防止手机端下拉刷新干扰手写 */
            overscroll-behavior: none; 
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: #666;
            margin: 0 0 15px 0;
        }

        .display-area {
            width: 100%;
            margin-bottom: 10px;
        }

        .question {
            font-size: 4rem;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
            line-height: 1;
        }

        .question-type {
            font-size: 0.9rem;
            color: #888;
            background: #eee;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* 手写板样式 */
        .canvas-container {
            position: relative;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #fff9f0; /*以此区分书写区域 */
            cursor: crosshair;
            touch-action: none; /* 关键：禁止触摸时的滚动行为 */
        }

        canvas {
            display: block;
        }

        .clear-icon {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255,255,255,0.8);
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.8rem;
            padding: 2px 6px;
            cursor: pointer;
            color: #666;
        }
        .clear-icon:hover { background: #eee; }

        .answer {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #eee;
            width: 100%;
            display: none;
        }

        .answer.show {
            display: flex;
            justify-content: space-around;
            animation: fadeIn 0.3s ease-in;
        }

        .answer-item {
            font-size: 1.2rem;
            color: #007bff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .answer-label {
            font-size: 0.7rem;
            color: #999;
            margin-bottom: 2px;
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }

        #rand-btn { background-color: #28a745; color: white; }
        #rand-btn:hover { background-color: #218838; }

        #submit-btn { background-color: #007bff; color: white; }
        #submit-btn:hover { background-color: #0069d9; }
        #submit-btn:disabled { background-color: #ccc; cursor: not-allowed; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>假名练习 & 手写板</h1>
    
    <div class="display-area">
        <div id="question-label" class="question-type">点击 Rand 开始</div>
        <div id="question-text" class="question">?</div>
    </div>

    <div class="canvas-container">
        <canvas id="writing-pad" width="280" height="200"></canvas>
        <button class="clear-icon" id="clear-canvas-btn">清除</button>
    </div>

    <div id="answer-box" class="answer">
        </div>

    <div class="btn-group">
        <button id="rand-btn">Rand (下一题)</button>
        <button id="submit-btn" disabled>Submit (看答案)</button>
    </div>
</div>

<script>
    // --- 1. 数据部分 ---
    const kanaData = [
        // 清音
        { h: 'あ', k: 'ア', r: 'a' }, { h: 'い', k: 'イ', r: 'i' }, { h: 'う', k: 'ウ', r: 'u' }, { h: 'え', k: 'エ', r: 'e' }, { h: 'お', k: 'オ', r: 'o' },
        { h: 'か', k: 'カ', r: 'ka' }, { h: 'き', k: 'キ', r: 'ki' }, { h: 'く', k: 'ク', r: 'ku' }, { h: 'け', k: 'ケ', r: 'ke' }, { h: 'こ', k: 'コ', r: 'ko' },
        { h: 'さ', k: 'サ', r: 'sa' }, { h: 'し', k: 'シ', r: 'shi' }, { h: 'す', k: 'ス', r: 'su' }, { h: 'せ', k: 'セ', r: 'se' }, { h: 'そ', k: 'ソ', r: 'so' },
        { h: 'た', k: 'タ', r: 'ta' }, { h: 'ち', k: 'チ', r: 'chi' }, { h: 'つ', k: 'ツ', r: 'tsu' }, { h: 'て', k: 'テ', r: 'te' }, { h: 'と', k: 'ト', r: 'to' },
        { h: 'な', k: 'ナ', r: 'na' }, { h: 'に', k: 'ニ', r: 'ni' }, { h: 'ぬ', k: 'ヌ', r: 'nu' }, { h: 'ね', k: 'ネ', r: 'ne' }, { h: 'の', k: 'ノ', r: 'no' },
        { h: 'は', k: 'ハ', r: 'ha' }, { h: 'ひ', k: 'ヒ', r: 'hi' }, { h: 'ふ', k: 'フ', r: 'fu' }, { h: 'へ', k: 'ヘ', r: 'he' }, { h: 'ほ', k: 'ホ', r: 'ho' },
        { h: 'ま', k: 'マ', r: 'ma' }, { h: 'み', k: 'ミ', r: 'mi' }, { h: 'む', k: 'ム', r: 'mu' }, { h: 'め', k: 'メ', r: 'me' }, { h: 'も', k: 'モ', r: 'mo' },
        { h: 'や', k: 'ヤ', r: 'ya' }, { h: 'ゆ', k: 'ユ', r: 'yu' }, { h: 'よ', k: 'ヨ', r: 'yo' },
        { h: 'ら', k: 'ラ', r: 'ra' }, { h: 'り', k: 'リ', r: 'ri' }, { h: 'る', k: 'ル', r: 'ru' }, { h: 'れ', k: 'レ', r: 're' }, { h: 'ろ', k: 'ロ', r: 'ro' },
        { h: 'わ', k: 'ワ', r: 'wa' }, { h: 'を', k: 'ヲ', r: 'wo' }, { h: 'ん', k: 'ン', r: 'n' },
        // 浊音
        { h: 'が', k: 'ガ', r: 'ga' }, { h: 'ぎ', k: 'ギ', r: 'gi' }, { h: 'ぐ', k: 'グ', r: 'gu' }, { h: 'げ', k: 'ゲ', r: 'ge' }, { h: 'ご', k: 'ゴ', r: 'go' },
        { h: 'ざ', k: 'ザ', r: 'za' }, { h: 'じ', k: 'ジ', r: 'ji' }, { h: 'ず', k: 'ズ', r: 'zu' }, { h: 'ぜ', k: 'ゼ', r: 'ze' }, { h: 'ぞ', k: 'ゾ', r: 'zo' },
        { h: 'だ', k: 'ダ', r: 'da' }, { h: 'ぢ', k: 'ヂ', r: 'ji' }, { h: 'づ', k: 'ヅ', r: 'zu' }, { h: 'で', k: 'デ', r: 'de' }, { h: 'ど', k: 'ド', r: 'do' },
        { h: 'ば', k: 'バ', r: 'ba' }, { h: 'び', k: 'ビ', r: 'bi' }, { h: 'ぶ', k: 'ブ', r: 'bu' }, { h: 'べ', k: 'ベ', r: 'be' }, { h: 'ぼ', k: 'ボ', r: 'bo' },
        // 半浊音
        { h: 'ぱ', k: 'パ', r: 'pa' }, { h: 'ぴ', k: 'ピ', r: 'pi' }, { h: 'ぷ', k: 'プ', r: 'pu' }, { h: 'ぺ', k: 'ペ', r: 'pe' }, { h: 'ぽ', k: 'ポ', r: 'po' }
    ];

    // --- 2. 逻辑控制 ---
    const questionText = document.getElementById('question-text');
    const questionLabel = document.getElementById('question-label');
    const answerBox = document.getElementById('answer-box');
    const randBtn = document.getElementById('rand-btn');
    const submitBtn = document.getElementById('submit-btn');

    let currentItem = null;
    let currentType = null; 

    function getRandomInt(max) { return Math.floor(Math.random() * max); }

    function renderQuestion() {
        const index = getRandomInt(kanaData.length);
        currentItem = kanaData[index];
        const mode = getRandomInt(3);
        
        // 重置界面
        answerBox.classList.remove('show');
        answerBox.innerHTML = '';
        submitBtn.disabled = false;
        
        // **关键修改：切换题目时自动清空手写板**
        clearCanvas();

        if (mode === 0) {
            currentType = 'h';
            questionText.textContent = currentItem.h;
            questionLabel.textContent = "平假名 (Hiragana)";
        } else if (mode === 1) {
            currentType = 'k';
            questionText.textContent = currentItem.k;
            questionLabel.textContent = "片假名 (Katakana)";
        } else {
            currentType = 'r';
            questionText.textContent = currentItem.r;
            questionLabel.textContent = "罗马音 (Romaji)";
        }
    }

    function renderAnswer() {
        if (!currentItem) return;
        let html = '';
        if (currentType !== 'h') html += `<div class="answer-item"><span class="answer-label">平假名</span><b>${currentItem.h}</b></div>`;
        if (currentType !== 'k') html += `<div class="answer-item"><span class="answer-label">片假名</span><b>${currentItem.k}</b></div>`;
        if (currentType !== 'r') html += `<div class="answer-item"><span class="answer-label">罗马音</span><b>${currentItem.r}</b></div>`;
        answerBox.innerHTML = html;
        answerBox.classList.add('show');
        submitBtn.disabled = true;
    }

    randBtn.addEventListener('click', renderQuestion);
    submitBtn.addEventListener('click', renderAnswer);

    // --- 3. 手写板功能实现 (Canvas) ---
    const canvas = document.getElementById('writing-pad');
    const ctx = canvas.getContext('2d');
    const clearCanvasBtn = document.getElementById('clear-canvas-btn');
    let isDrawing = false;

    // 配置画笔
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#333';

    // 获取坐标辅助函数
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        // 触摸事件
        if (e.touches && e.touches.length > 0) {
            return {
                x: e.touches[0].clientX - rect.left,
                y: e.touches[0].clientY - rect.top
            };
        }
        // 鼠标事件
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault(); // 防止手机端拖动页面
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDrawing() {
        isDrawing = false;
        ctx.closePath();
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 鼠标事件 (电脑端)
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // 触摸事件 (手机端)
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    // 清除按钮事件
    clearCanvasBtn.addEventListener('click', clearCanvas);

    // 初始化
    renderQuestion();

</script>
</body>
</html>
